<title>Waters Lab — R2 prototype</title>
<style>/* UX Recovery design kit (design artefact, not app code). iPhone 15 Pro frame 393×852 pt. */
:root {
  --navy: #071526; --ink: #0d1726; --ink2: #3b4757; --muted: #566070; --line: rgba(13, 23, 38, .09);
  --bg: #f2f4f7; --card: #fff; --blue: #0a63ce; --blue-soft: #e8f1fc;
  --sam: #3f51c9; --sam-soft: #eceffd; --nat: #0b8f7f; --nat-soft: #e5f6f3;
  --ok: #1f9d55; --ok-soft: #e7f6ed; --warn: #b26a00; --warn-soft: #fdf1df; --none: #687384; --none-soft: #eef0f3;
  --r: 18px; --font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #d9dee5; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
.phone { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--bg); }
.status { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 36px; font: 600 16px var(--font); }
.status i { font-style: normal; letter-spacing: 2px; font-size: 12px; }
.scroll { position: absolute; inset: 54px 0 0 0; overflow: hidden; }

/* navigation */
.nav { height: 44px; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
.back { color: var(--blue); font: 400 17px var(--font); display: flex; align-items: center; gap: 2px; }
.back b { font-weight: 500; font-size: 24px; line-height: 0; margin-top: -2px; }
.nav .title { flex: 1; text-align: center; font: 600 17px var(--font); margin-right: 60px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font: 600 13px var(--font); margin-left: auto; }
.large { padding: 4px 20px 12px; }
.large h1 { margin: 0; font: 700 34px/1.12 var(--font); letter-spacing: -.4px; }
.large p { margin: 4px 0 0; color: var(--muted); font: 400 15px var(--font); }
.orgpill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); font: 600 14px var(--font); color: var(--ink); }
.orgpill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }

/* sections */
.sec { padding: 6px 20px 2px; font: 600 13px var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.group { margin: 8px 16px 16px; background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font: 600 16px var(--font); }
.row .t span { display: block; color: var(--muted); font: 400 14px var(--font); margin-top: 1px; }
.chev { color: #b6bec9; font-size: 22px; }
.count { color: var(--muted); font: 500 15px var(--font); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font: 600 12px var(--font); white-space: nowrap; }
.chip.none { background: var(--none-soft); color: var(--none); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.ref { background: rgba(255,255,255,.85); color: var(--ink2); border: 1px solid var(--line); }
.chip.src { background: var(--blue-soft); color: var(--blue); font-weight: 600; }

/* instrument */
.inst { display: block; width: 100%; height: 100%; }
.hit .hitbox { fill: transparent; stroke: transparent; }
.hit.sel .hitbox { fill: rgba(10, 99, 206, .14); stroke: #2f86ff; stroke-width: 2.5; }
.stage { position: relative; margin: 0 16px; border-radius: 26px; background: radial-gradient(120% 90% at 50% 15%, #ffffff 0%, #e9eef4 80%); padding: 14px 18px 10px; }
.stage .ref { position: absolute; bottom: 10px; left: 12px; font-size: 11px; }
.stage .hint { text-align: center; color: var(--muted); font: 500 13px var(--font); margin-top: 4px; }
.stage .callout { position: absolute; padding: 5px 10px; border-radius: 10px; background: var(--navy); color: #fff; font: 600 12px var(--font); box-shadow: 0 6px 16px rgba(7,21,38,.25); }

/* workspace header + destination bar */
.ident { padding: 10px 20px 8px; }
.ident .id { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
.ident h1 { margin: 2px 0 0; font: 700 28px/1.12 var(--font); letter-spacing: -.3px; }
.ident .loc { margin-top: 4px; color: var(--blue); font: 500 15px var(--font); }
.dest { display: flex; gap: 8px; padding: 10px 16px; overflow: hidden; background: rgba(242,244,247,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.dest span { padding: 8px 13px; border-radius: 999px; background: #fff; font: 600 14px var(--font); color: var(--ink2); white-space: nowrap; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
.dest span.on { background: var(--navy); color: #fff; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 16px; }
.fact { background: #fff; border-radius: 16px; padding: 11px 12px; min-height: 74px; }
.fact small { display: block; color: var(--muted); font: 500 12px var(--font); }
.fact b { display: block; margin-top: 6px; font: 600 15px/1.2 var(--font); }
.fact .chip { margin-top: 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 16px 12px; }
.tile { background: #fff; border-radius: 18px; padding: 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
.tile .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); font-size: 18px; }
.tile b { font: 600 16px var(--font); margin-top: 10px; display: block; }
.tile span { color: var(--muted); font: 400 13px var(--font); }

/* specialists */
.dock { position: absolute; left: 10px; right: 10px; bottom: 92px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: rgba(255,255,255,.9); backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(7,21,38,.18), 0 0 0 1px var(--line); }
.spec { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 16px; min-width: 0; }
.spec.s { background: var(--sam-soft); } .spec.n { background: var(--nat-soft); }
.mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 15px var(--font); flex: none; }
.s .mark, .mark.s { background: linear-gradient(135deg, #5b6cf0, #3243b8); } .n .mark, .mark.n { background: linear-gradient(135deg, #17b7a2, #0a7b6d); }
.spec .who { flex: 1; min-width: 0; }
.spec .who b { display: block; font: 700 13.5px var(--font); }
.spec .who span { display: block; font: 500 11px var(--font); color: var(--ink2); }
.act { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-size: 15px; flex: none; }
.s .act { color: var(--sam); } .n .act { color: var(--nat); }

/* tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(250,251,252,.94); backdrop-filter: blur(20px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding-top: 8px; }
.tabbar div { width: 80px; text-align: center; font: 500 10.5px var(--font); color: #8a94a3; }
.tabbar div i { display: block; font-style: normal; font-size: 22px; margin-bottom: 2px; }
.tabbar .on { color: var(--blue); }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #0d1726; }

/* list thumbs */
.thumbbox { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(#fff, #eef2f6); padding: 4px; flex: none; }
.minis { display: flex; gap: 6px; margin-top: 10px; }
.minis .mini { width: 52px; height: 56px; border-radius: 12px; background: linear-gradient(#fff, #eef2f6); padding: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 16px; }
.icard { background: #fff; border-radius: 22px; padding: 10px 12px 14px; }
.icard .pic { height: 150px; border-radius: 16px; background: radial-gradient(110% 90% at 50% 15%, #fff 0%, #edf1f5 85%); padding: 6px 10px; }
.icard .id { margin-top: 10px; font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
.icard b { display: block; font: 600 15px/1.25 var(--font); margin-top: 2px; }
.icard span { display: block; font: 400 13px var(--font); color: var(--muted); margin-top: 2px; }

/* specs */
.specrow { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.specrow:last-child { border-bottom: 0; }
.specrow .k { color: var(--ink2); font: 400 15px var(--font); }
.specrow .v { text-align: right; font: 600 15px var(--font); max-width: 58%; }
.specrow .v .chip { margin-top: 4px; }
.modhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.modhead b { font: 600 17px var(--font); }

/* segmented */
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 8px 16px; padding: 3px; border-radius: 12px; background: #e3e7ed; }
.seg span { text-align: center; padding: 8px; border-radius: 9px; font: 600 14px var(--font); color: var(--ink2); }
.seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.sym { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.sym:last-child { border-bottom: 0; }
.sym .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; flex: none; }
.sym b { flex: 1; font: 500 16px var(--font); }

/* consultation */
.chathead { display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px; }
.chathead .who b { display: block; font: 700 17px var(--font); }
.chathead .who span { display: block; color: var(--muted); font: 500 13px var(--font); }
.ctx { margin: 0 16px 8px; padding: 10px 12px; border-radius: 14px; background: #fff; display: flex; flex-wrap: wrap; gap: 6px; }
.ctx .chip { background: var(--none-soft); color: var(--ink2); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 4px 16px 10px; padding: 3px; border-radius: 12px; background: #e3e7ed; }
.modes span { text-align: center; padding: 8px; border-radius: 9px; font: 600 14px var(--font); color: var(--ink2); }
.modes span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.bubble { margin: 8px 16px; padding: 12px 14px; border-radius: 18px; font: 400 15px/1.42 var(--font); max-width: 86%; }
.bubble.me { margin-left: auto; background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
.bubble.ai { background: #fff; border-bottom-left-radius: 6px; }
.bubble.ai h4 { margin: 0 0 6px; font: 700 13px var(--font); color: var(--ok); text-transform: uppercase; letter-spacing: .4px; }
.bubble.ai ol { margin: 6px 0 0; padding-left: 20px; }
.bubble.ai li { margin: 3px 0; }
.composer { position: absolute; left: 12px; right: 12px; bottom: 30px; display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 16px; border-radius: 26px; background: #fff; box-shadow: 0 6px 20px rgba(7,21,38,.12), 0 0 0 1px var(--line); }
.composer span { flex: 1; color: #98a2b0; font: 400 16px var(--font); }
.composer .act { width: 38px; height: 38px; }
.voicebig { margin: 24px auto 8px; width: 210px; height: 210px; border-radius: 50%; display: grid; place-items: center; }
.wave { display: flex; gap: 5px; align-items: center; height: 70px; }
.wave i { display: block; width: 6px; border-radius: 3px; background: #fff; }
.vstate { text-align: center; font: 600 20px var(--font); }
.vsub { text-align: center; color: var(--muted); font: 400 14px var(--font); margin-top: 4px; }
.vbtns { position: absolute; bottom: 60px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; }
.vbtn { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.vbtn.end { background: #e5484d; color: #fff; }
.vbtn small { display: block; }
.caption { text-align: center; color: var(--muted); font: 400 12px var(--font); margin-top: 6px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(7,21,38,.25); padding: 8px 0 34px; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: #cdd3db; margin: 0 auto 10px; }
.dim { position: absolute; inset: 0; background: rgba(7,21,38,.35); }
.check { color: var(--blue); font-size: 20px; }
.step { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.step:last-child { border-bottom: 0; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font: 700 13px var(--font); flex: none; }
.step b { display: block; font: 600 15px var(--font); }
.step span { display: block; color: var(--muted); font: 400 13px var(--font); margin-top: 2px; }
.svc { background: var(--warn-soft); color: var(--warn); }

/* revision 2 */
.destgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 16px; }
.dg { background: #fff; border-radius: 16px; padding: 11px 10px 10px; min-height: 84px; display: flex; flex-direction: column; gap: 6px; }
.dg .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); }
.dg b { font: 600 14px var(--font); }
.dg span { font: 500 12px var(--font); color: var(--muted); }
.dock2 { position: absolute; left: 12px; right: 12px; bottom: 94px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sp { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px 0 8px; border-radius: 28px; color: #fff; box-shadow: 0 8px 22px rgba(7,21,38,.22); }
.sp.s { background: linear-gradient(135deg, #5466e4, #3243b8); } .sp.n { background: linear-gradient(135deg, #14ad99, #0a7b6d); }
.sp .mk { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font: 700 17px var(--font); }
.sp b { display: block; font: 700 16px var(--font); } .sp span { display: block; font: 500 12px var(--font); opacity: .9; }
.reftag { position: absolute; top: 8px; right: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid var(--line); font: 600 10px var(--font); color: var(--ink2); }
.panel { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(7,21,38,.25); }
.panel .grab { width: 38px; height: 5px; border-radius: 3px; background: #c4cbd4; margin: 8px auto 6px; }
.vlabel { text-align: center; font: 500 12px var(--font); color: var(--ink2); margin-top: 6px; }
.mini-phone { width: 393px; height: 852px; position: relative; overflow: hidden; background: var(--bg); }
.phone.dark { --bg: #0b1220; --card: #151e2e; --ink: #eef2f7; --ink2: #c5cede; --muted: #9aa6b8; --line: rgba(255,255,255,.08); --blue-soft: #16294a; --none-soft: #222d3f; --none: #a9b3c3; --ok-soft: #12321f; color: var(--ink); }
.phone.dark .stage { background: radial-gradient(120% 90% at 50% 15%, #26324a 0%, #121a29 80%); }
.phone.dark .dg, .phone.dark .group, .phone.dark .fact, .phone.dark .tile { background: var(--card); }
.phone.dark .tabbar { background: rgba(14,20,32,.94); }
.phone.dark .home-ind { background: #eef2f7; }
.state { margin: 70px 28px 0; text-align: center; }
.state .big { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 14px; display: grid; place-items: center; font-size: 30px; }
.state b { display: block; font: 700 20px var(--font); }
.state p { color: var(--muted); font: 400 15px/1.4 var(--font); margin: 8px 0 18px; }
.btn { display: inline-block; padding: 12px 20px; border-radius: 14px; background: var(--blue); color: #fff; font: 600 16px var(--font); }
.btn.sec2 { background: var(--blue-soft); color: var(--blue); }
/* UX Recovery R2 visual system (design artefact). 8-pt grid; SF Pro type scale; one accent per role. */
:root {
  --navy: #071526; --navy2: #0f2440; --ink: #0c1524; --ink2: #3a4556; --muted: #566070; --hair: rgba(12, 21, 36, .1);
  --bg: #f2f3f6; --card: #fff; --blue: #0a63ce; --blue-soft: #e8f1fc;
  --sam: #4152d1; --sam-soft: #eceefc; --nat: #0b8f7f; --nat-soft: #e3f5f2; --warn: #9a5b00; --warn-soft: #fdf1df;
}
.r2 .t-large { font: 700 34px/1.1 var(--font); letter-spacing: -.5px; }
.r2 .t-title { font: 700 22px/1.2 var(--font); letter-spacing: -.3px; }
.r2 .t-head { font: 600 17px/1.25 var(--font); }
.r2 .t-body { font: 400 17px/1.3 var(--font); }
.r2 .t-sub { font: 400 15px/1.3 var(--font); color: var(--muted); }
.r2 .t-cap { font: 500 13px/1.25 var(--font); color: var(--muted); }
.r2 .t-id { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .3px; color: var(--muted); }

/* Home identity band */
.band { background: radial-gradient(130% 120% at 85% -10%, #1c3f6e 0%, var(--navy) 55%); color: #fff; padding: 0 20px 22px; }
.band .bar { height: 44px; display: flex; align-items: center; justify-content: space-between; }
.band .org { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--font); padding: 7px 12px 7px 8px; border-radius: 999px; background: rgba(255,255,255,.1); }
.band .org .m { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #2ea7ff, #0a63ce); display: grid; place-items: center; font: 800 11px var(--font); }
.band .av { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; font: 600 13px var(--font); }
.band h1 { margin: 14px 0 4px; font: 700 34px/1.08 var(--font); letter-spacing: -.5px; }
.band p { margin: 0; color: rgba(255,255,255,.72); font: 400 15px var(--font); }
.band .stats { display: flex; gap: 22px; margin-top: 16px; }
.band .stats b { display: block; font: 700 22px var(--font); } .band .stats span { font: 500 12px var(--font); color: rgba(255,255,255,.65); }

.sect { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 20px 8px; }
.sect h2 { margin: 0; font: 700 20px var(--font); letter-spacing: -.2px; } .sect a { color: var(--blue); font: 500 15px var(--font); }
.labcard { margin: 0 16px 10px; background: var(--card); border-radius: 20px; padding: 14px 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.labcard .strip { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 8px; }
.labcard .strip div { flex: 1; height: 62px; border-radius: 12px; background: linear-gradient(#f7f9fb, #e9eef3); padding: 4px; }
.recents { display: flex; gap: 10px; padding: 0 16px; overflow: hidden; }
.rc { width: 132px; flex: none; background: var(--card); border-radius: 18px; padding: 8px 8px 10px; }
.rc .p { height: 96px; border-radius: 12px; background: linear-gradient(#f7f9fb, #e9eef3); padding: 4px; }
.rc .t-id { margin: 8px 2px 0; display: block; font-size: 12px; } .rc b { display: block; margin: 1px 2px 0; font: 600 14px var(--font); }

/* Room list (scales to many systems) */
.navlg { padding: 0 16px; height: 44px; display: flex; align-items: center; justify-content: space-between; }
.navlg .back { color: var(--blue); font: 400 17px var(--font); }
.search { margin: 2px 16px 10px; height: 36px; border-radius: 10px; background: #e5e8ed; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: #7b8594; font: 400 17px var(--font); }
.chips { display: flex; gap: 8px; padding: 0 16px 10px; }
.chips span { padding: 6px 12px; border-radius: 999px; background: #fff; font: 600 13px var(--font); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--hair); }
.chips span.on { background: var(--navy); color: #fff; box-shadow: none; }
.list { margin: 0 16px; background: var(--card); border-radius: 18px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; position: relative; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 96px; right: 0; height: 1px; background: var(--hair); }
.li .pv { width: 72px; height: 72px; border-radius: 14px; background: linear-gradient(#f7f9fb, #e7ecf1); padding: 4px; flex: none; position: relative; }
.li .pv .rf { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); font: 600 8.5px var(--font); color: var(--ink2); background: rgba(255,255,255,.92); padding: 1px 5px; border-radius: 999px; white-space: nowrap; }
.li .tx { flex: 1; min-width: 0; } .li .tx b { display: block; font: 600 16px var(--font); } .li .tx .t-cap { margin-top: 2px; display: block; }
.li .chev { color: #b4bcc7; font-size: 20px; }

/* Workspace */

ttps://www.waters.com/webassets/cms/library/docs/720002552en.pdf","verified":true},{"no":"715004753 Rev. B","title":"2998 PDA Detector Overview and Maintenance Guide","url":"https://support.waters.com/@api/deki/files/13264/715004753.pdf?revision=1","verified":true},{"no":"715003768","title":"Alliance Column Heater and Heater/Cooler Operator Guide","url":"https://www.waters.com/webassets/cms/support/docs/716003768ra_en.pdf","verified":true},{"no":"WKB25194","title":"High delta psi and unstable pressure with the e2695","url":"https://support.waters.com/KB_Inst/Chromatography/WKB25194_e2695_High_Delta_Psi_pressure_unstable","verified":true}],"arrangement":"715003794 · e2695 Operator's Guide"}},"SYSTEMS":[["SYN-ARC-01","arc"],["SYN-ALL-02","alliance"],["SYN-ALL-03","alliance"],["SYN-ARC-04","arc"],["SYN-ARC-05","arc"],["SYN-ALL-06","alliance"]],"FLOWS":[{"id":"app-rt-shift","path":"application","title":"Retention time shift","checks":[{"t":"Compare the run with the last known-good run of this method on this system (times, pressure trace).","lv":"user"},{"t":"Confirm the bottles, solvent lines and method composition match; check the method temperature set point.","lv":"user"},{"t":"Inspect column fittings and the drip tray for liquid; watch the pressure trace for unusual ripple.","lv":"user"}],"actions":[{"t":"Prepare fresh mobile phase as the method describes and prime the solvent lines.","lv":"user"},{"t":"Tighten or remake a leaking column connection following the lab SOP.","lv":"user"},{"t":"If the pressure ripple is high, follow the pump flow in the Engineering path (check valves, prime).","lv":"maint"}]},{"id":"app-resolution","path":"application","title":"Poor resolution","checks":[{"t":"Run your system suitability standard and compare with the last passing result.","lv":"user"},{"t":"Check that the installed column (chemistry, dimensions) matches the method record.","lv":"user"},{"t":"Review the tubing and fittings changed since the last good run.","lv":"user"}],"actions":[{"t":"Replace the guard column, then the analytical column if the problem remains (column care documentation).","lv":"user"},{"t":"Remake fittings with the documented tubing and ferrule depth to remove voids.","lv":"user"},{"t":"Method changes go through change control / QA approval in a regulated lab.","lv":"user"}]},{"id":"app-tailing","path":"application","title":"Peak tailing or split peaks","checks":[{"t":"Note whether all peaks or only early peaks are affected.","lv":"user"},{"t":"Inspect the column inlet and outlet connections for correct seating.","lv":"user"},{"t":"Compare the sample diluent and injection volume with the method.","lv":"user"}],"actions":[{"t":"Replace and correctly position the ferrule on the column inlet tubing.","lv":"user"},{"t":"Replace the guard column, then the column.","lv":"user"},{"t":"Match the diluent to the starting conditions as the method allows.","lv":"user"}]},{"id":"app-carryover","path":"application","title":"Carryover","checks":[{"t":"Inject a blank after your highest standard and quantify the carryover.","lv":"user"},{"t":"Check the wash bottle level and that wash solvent flows during priming.","lv":"user"},{"t":"Compare the wash solvent and gradient end with the method.","lv":"user"}],"actions":[{"t":"Prime the needle wash and use a wash solvent strong enough to dissolve the sample.","lv":"user"},{"t":"Run blank injections after cleaning to confirm.","lv":"user"},{"t":"If no wash solvent flows, internal wash tubing behind the side panel is service work.","lv":"service"}]},{"id":"app-baseline","path":"application","title":"Baseline noise or drift","checks":[{"t":"Check that the mobile phase is fresh, filtered and degassed, and that the bottles and inlet filters are clean.","lv":"user"},{"t":"Compare the noise with the pump pressure trace: ripple at the pump stroke points to solvent delivery.","lv":"user"}],"actions":[{"t":"Prepare fresh, filtered, degassed mobile phase and replace the whole bottle.","lv":"user"},{"t":"Flush the flow cell or clear bubbles as the detector guide describes.","lv":"maint"}]},{"id":"app-sensitivity","path":"application","title":"Sensitivity loss / small peaks","checks":[{"t":"Re-inject a fresh standard and compare area and retention with the reference.","lv":"user"},{"t":"Confirm the detector settings in the method (wavelength, sensitivity, filter).","lv":"user"},{"t":"Check replicate injection repeatability (injector) and the lamp energy (optical).","lv":"user"}],"actions":[{"t":"Prime the system and purge the injector as the module documentation describes.","lv":"user"},{"t":"Clean the flow cell, or replace the lamp per the detector guide when energy is low.","lv":"maint"}]},{"id":"app-suitability","path":"application","title":"System suitability failure","checks":[{"t":"Identify which criterion failed and compare with the last passing run.","lv":"user"},{"t":"Check the preparation records of the standard and mobile phase.","lv":"user"},{"t":"Follow the matching symptom flow (resolution, tailing, sensitivity, retention).","lv":"user"}],"actions":[{"t":"Correct the cause, then repeat the suitability test before running samples.","lv":"user"},{"t":"Document the failure and the corrective action per your quality system (GxP).","lv":"user"}]},{"id":"eng-pressure-ripple","path":"engineering","title":"Pressure instability / high ripple","checks":[{"t":"Watch the pressure trace in the console and compare with a known-good run.","lv":"user"},{"t":"Check solvent levels, inlet filters and lines for air bubbles.","lv":"user"},{"t":"Inspect the pump area and drip tray for liquid.","lv":"user"}],"actions":[{"t":"Degas solvents, replace blocked reservoir filters and prime the pump.","lv":"user"},{"t":"Clean (sonicate) or replace check valves only as documented for this module.","lv":"maint"},{"t":"Seal replacement or pump-head repair beyond the guide's user maintenance: service only.","lv":"service"}]},{"id":"eng-high-pressure","path":"engineering","title":"High pressure / over-pressure stop","checks":[{"t":"If your SOP allows: replace the column with a union and compare the pressure.","lv":"user"},{"t":"Isolate sections from the detector back to the pump to find where pressure drops.","lv":"user"},{"t":"Check solvent age and buffer solubility at the organic proportion used.","lv":"user"}],"actions":[{"t":"Replace the guard column / in-line filter or clean the column per its care documentation.","lv":"user"},{"t":"Replace solvents and reservoir filters; flush with a compatible solvent.","lv":"user"},{"t":"Replace a blocked external tubing or mixer as documented for the module.","lv":"maint"}]},{"id":"eng-no-flow","path":"engineering","title":"Low pressure / no flow / lost prime","checks":[{"t":"Check bottle levels, inlet filters and that every line is submerged.","lv":"user"},{"t":"Look for liquid at fittings, the drip tray and the waste line.","lv":"user"},{"t":"Follow the documented lost-prime checklist for the module.","lv":"user"}],"actions":[{"t":"Refill and degas solvents, then prime all lines in use.","lv":"user"},{"t":"Close the vent/prime valve and tighten leaking external fittings per SOP.","lv":"user"},{"t":"Clean or replace check valves as documented for this module.","lv":"maint"}]},{"id":"eng-leak","path":"engineering","title":"Leak / leak sensor alarm","checks":[{"t":"Stop the flow; wear PPE per the solvent SDS; locate the source of the liquid.","lv":"user"},{"t":"Check external fittings and the waste-tubing routing.","lv":"user"},{"t":"Empty the waste bottle; check that the waste line drains downward.","lv":"user"}],"actions":[{"t":"Tighten or remake the leaking external fitting.","lv":"user"},{"t":"Dry the leak sensor and its port as the module documentation describes, then reset.","lv":"maint"},{"t":"Leaks inside a module (behind covers) or a sensor that alarms when dry: service only.","lv":"service"}]},{"id":"eng-injector","path":"engineering","title":"Injection fault / poor area repeatability","checks":[{"t":"Check that vials, caps and plate type match the configuration in the software.","lv":"user"},{"t":"Inspect the wash and purge bottles and lines for air.","lv":"user"},{"t":"Run replicate injections of a standard and compare %RSD with the reference.","lv":"user"}],"actions":[{"t":"Prime the system and purge the injector as the module documentation describes.","lv":"user"},{"t":"Run the module's documented maintenance tests / replace the needle as the guide describes.","lv":"maint"},{"t":"Injection valve, drive or sensor faults: service only.","lv":"service"}]},{"id":"eng-lamp","path":"engineering","title":"Detector initialization / lamp failure","checks":[{"t":"Note the LED state and the exact error message.","lv":"user"},{"t":"Read lamp hours and lamp energy as the detector guide describes.","lv":"user"},{"t":"Flush the flow cell to remove bubbles; check room humidity and air vents.","lv":"user"}],"actions":[{"t":"Replace the lamp with the type documented for this detector (allow it to cool first, power off).","lv":"maint"},{"t":"Clean or flush the flow cell as documented.","lv":"maint"},{"t":"Do not touch the lamp connector while energized; power-supply or internal faults: service only (high voltage).","lv":"service"}]},{"id":"eng-temperature","path":"engineering","title":"Temperature not reached / temperature alarm","checks":[{"t":"Compare the set point with room temperature and the module's documented range.","lv":"user"},{"t":"Check doors are closed and air vents are free.","lv":"user"},{"t":"Check the console configuration matches the installed column module.","lv":"user"}],"actions":[{"t":"Use a set point within the range documented for this module.","lv":"user"},{"t":"Correct the module configuration in the console.","lv":"user"},{"t":"Heater, chiller or sensor hardware faults: service only.","lv":"service"}]},{"id":"eng-communication","path":"engineering","title":"Communication fault","checks":[{"t":"Check that Ethernet cables are seated at both ends and the switch is powered.","lv":"user"},{"t":"Note the exact message and time; check the system event log.","lv":"user"},{"t":"Restart in the documented order (software, modules) per lab SOP.","lv":"user"}],"actions":[{"t":"Reconnect cables and restore switch power.","lv":"user"},{"t":"Ask your IT / CDS administrator to review the instrument configuration.","lv":"user"},{"t":"LAN card or electronics replacement: service only.","lv":"service"}]},{"id":"eng-alarm","path":"engineering","title":"Hardware alarm / error message","checks":[{"t":"Record the exact error text, LED state and what the system was doing.","lv":"user"},{"t":"Look the message up in the module guide's error / troubleshooting table.","lv":"user"},{"t":"Follow the matching flow (leak, pressure, temperature, lamp, communication).","lv":"user"}],"actions":[{"t":"Apply the corrective action the guide documents for that message.","lv":"user"},{"t":"Never open covers or bypass interlocks; internal faults (steady red LED, power, electronics): service only.","lv":"service"}]}]};

  +'<div class="sect" style="padding-top:2px"><h2 style="font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">'+t('fix')+'</h2></div><div class="grp">'+f.actions.map(c => '<div class="rowx"><div class="tx"><b style="font-weight:500">'+esc(c.t)+'</b>'+(lv(c)?'<span style="margin-top:4px">'+lv(c)+'</span>':'')+'</div></div>').join('')+'</div>'

 supportHub(){ return '<div class="screen">'+nav(t('home'),'#/home')+'<div class="ttl"><div class="t-large">'+t('ask')+'</div><div class="t-sub">Synthetic Lab A</div></div>'+support('Synthetic Lab A')+tabbar('spec')+'</div>'; },
};

function render(){
  document.documentElement.lang = L; document.documentElement.dir = L === 'he' ? 'rtl' : 'ltr';
  const h = (location.hash || '#/home').slice(2).split('/');
  let out;
  if (h[0] === 'lab') out = V.lab(); else if (h[0] === 'room') out = V.room(); else if (h[0] === 'support') out = V.supportHub();
  else if (h[0] === 'ws' && h[2] === 'module') out = V.module(h[1], h[3]);
  else if (h[0] === 'ws' && h[2] === 'troubleshooting') out = V.ts(h[1], h[3] || 'engineering', h[4] || null);
  else if (h[0] === 'ws' && h[2] === 'flow') out = V.flow(h[1], h[3], h[4] || null);
  else if (h[0] === 'ws' && h[2]) out = V.dest(h[1], h[2]);
  else if (h[0] === 'ws') out = V.ws(h[1]); else out = V.home();
  document.getElementById('app').innerHTML = out; window.scrollTo(0, 0);
  // tapping a module on the hero highlights it, then opens it
  const st = document.getElementById('stage');
  if (st) st.querySelectorAll('.hit').forEach(g => { g.setAttribute('role','button'); g.setAttribute('tabindex','0'); g.style.cursor='pointer';
    g.addEventListener('click', () => { st.querySelectorAll('.hit').forEach(x => x.classList.remove('sel')); g.classList.add('sel'); setTimeout(() => go('#/ws/'+h[1]+'/module/'+g.dataset.module), 220); }); });
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-lang],[data-sheet]'); if (!el) return;
  if (el.dataset.lang) { L = el.dataset.lang; render(); if (S.open) drawSheet(); return; }
  if (el.dataset.sheet) { openSheet(el.dataset.sheet, el.dataset.ctx); return; }
  if (el.dataset.go) go(el.dataset.go);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go][role]')) { e.preventDefault(); go(e.target.dataset.go); } if (e.key === 'Escape' && S.open) closeSheet(); });
window.addEventListener('hashchange', render);

// ---- consultation sheet (UI prototype only: no network, no AI) ----
const S = { open: false, who: 'samuel', mode: 'text', ctx: [], msgs: [], vstate: 'idle', muted: false, timer: null, srcOpen: false };
const P = { samuel: { n: 'Samuel', role: 'samRole', g: 'linear-gradient(135deg,#5a6cf0,#3243b8)', c: 'var(--sam)', soft: 'var(--sam-soft)', ico: I.gear, q: 'Pressure ripple went up after a solvent change. What first?', a: ['Start with the solvent path:','Check bottle levels and inlet filters; look for air in the lines.','Degas the new solvent, then prime the pump.','Compare the pressure trace with a known-good run.'], src: [['Waters KB WKB75861','https://support.waters.com/KB_Inst/Other/WKB75861_What_is_the_maximum_backpressure_for_an_ACQUITY_Arc_pump'],['ACQUITY Arc System Guide 715004747','https://help.waters.com/content/dam/waters/en/support/usermanuals/2022/715004747/715004747v04.pdf']] },
  nathanel: { n: 'Nathanel', role: 'natRole', g: 'linear-gradient(135deg,#16b8a3,#0a7b6d)', c: 'var(--nat)', soft: 'var(--nat-soft)', ico: I.peaks, q: 'Baseline noise increased on the PDA. Where do I start?', a: ['Separate detector from method causes:','Compare with a blank injection at the same wavelength.','Check mobile-phase quality and degassing.','Review the lamp energy test in the detector guide.'], src: [['2998 PDA Detector Guide 715004753','https://support.waters.com/@api/deki/files/13264/715004753.pdf?revision=1']] } };
const PDA_ENG = { q: 'Lamp energy looks low on the PDA. What should I check?', a: ['Confirm with the detector diagnostics first:','Run the lamp energy test described in the detector guide.','Check lamp hours against the guide before replacing it.','Confirm the flow cell is clean and free of bubbles.'], src: [['2998 PDA Detector Guide 715004753','https://support.waters.com/@api/deki/files/13264/715004753.pdf?revision=1'],['Waters KB WKB7196','https://support.waters.com/KB_Inst/Chromatography/WKB7196_How_do_I_confirm_that_the_2998_Photodiode_Array_Detector_is_still_within_specification']] };
function sample(){ const base = P[S.who]; return (S.who === 'samuel' && S.ctx.some(c => /PDA/.test(c))) ? Object.assign({}, base, PDA_ENG) : base; }
function openSheet(who, ctx){ Object.assign(S, { open: true, who, mode: 'text', ctx: (ctx||'').split(' · ').filter(Boolean), msgs: [], vstate: 'idle', muted: false, srcOpen: false }); drawSheet(); document.getElementById('sheet').classList.add('on'); document.getElementById('veil').classList.add('on'); }
function closeSheet(){ clearTimeout(S.timer); S.open = false; document.getElementById('sheet').classList.remove('on'); document.getElementById('veil').classList.remove('on'); }
document.getElementById('veil').addEventListener('click', closeSheet);
function drawSheet(){
  const p = sample(), el = document.getElementById('sheet');
  const head = '<div class="grab"></div><div class="sh-head"><div class="sh-av" style="background:'+p.g+'">'+p.ico+'</div><div class="nm"><b>'+(S.who==='samuel'?t('samN'):t('natN'))+'</b><span>'+t(p.role)+'</span></div><button class="closebtn" data-close>'+t('close')+'</button></div>'
   +'<div class="seg2" role="tablist" style="margin-bottom:8px"><button role="tab" aria-selected="'+(S.mode==='text')+'" class="'+(S.mode==='text'?'on':'')+'" data-mode="text">'+t('text')+'</button><button role="tab" aria-selected="'+(S.mode==='voice')+'" class="'+(S.mode==='voice'?'on':'')+'" data-mode="voice">'+t('voice')+'</button></div>'
   +'<div class="ctxrow"><span class="lbl">'+t('about')+'</span>'+(S.ctx.length?S.ctx.map((c,i) => '<span class="chipx" dir="ltr">'+esc(c)+'<button aria-label="Remove '+esc(c)+'" data-rmctx="'+i+'">×</button></span>').join(''):'<span class="lbl">—</span>')+'</div>';
  let body = '', foot = '';
  if (S.mode === 'text') {
    body = '<div class="proto-note">'+t('sample')+'</div>' + S.msgs.map(m => m.me ? '<div class="msg q"><span style="background:'+p.c+'">'+esc(m.t)+'</span></div>'
      : '<div class="msg a">'+esc(p.a[0])+'<ol>'+p.a.slice(1).map(x => '<li>'+esc(x)+'</li>').join('')+'</ol><button class="cite" data-src>'+I.book+'<span>'+p.src.length+' '+t('sources')+'</span></button>'+(S.srcOpen?'<div class="srcs">'+p.src.map(([n,u]) => '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+esc(n)+'</a>').join('')+'</div>':'')+'</div>').join('');
    foot = '<div class="sh-foot"><input id="sin" placeholder="'+t('msg')+' · '+(S.who==='samuel'?t('samN'):t('natN'))+'" value="'+(S.msgs.length?'':esc(p.q))+'" aria-label="'+t('msg')+'"><button class="bt" style="background:'+p.soft+';color:'+p.c+'" data-mode="voice" aria-label="'+t('voice')+'">'+I.mic+'</button><button class="bt" style="background:'+p.c+';color:#fff" data-send aria-label="Send">'+I.up+'</button></div>';
  } else {
    const lbl = { connecting: t('vConnecting'), listening: t('vListening'), speaking: t('vSpeaking'), ended: t('vEnded'), idle: t('vConnecting') }[S.vstate];
    body = '<div class="orb '+(S.vstate==='speaking'?'speaking':'')+'" style="background:'+(S.vstate==='ended'?'#eef0f3':p.g)+'">'+(S.vstate==='ended'?'<span style="font:700 30px var(--font);color:#566070">✓</span>':S.vstate==='connecting'||S.vstate==='idle'?'<div style="width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.9);border-right-color:transparent"></div>':'<div class="wave">'+[16,30,46,24,52,32,20].map(h => '<i style="height:'+(S.muted?6:h)+'px"></i>').join('')+'</div>')+'</div>'
      +'<div style="text-align:center;margin-top:14px;font:600 20px var(--font)" aria-live="polite">'+(S.muted&&S.vstate!=='ended'?t('mute')+' · ':'')+lbl+'</div><div style="text-align:center;margin-top:6px;font:500 13px var(--font);color:var(--muted)">'+t('quota')+'</div>'
      +'<div class="vctl">'+(S.vstate==='ended'?'<button data-call><span class="c" style="background:'+p.c+';color:#fff">'+I.mic+'</span>'+t('again')+'</button>':'<button data-mute aria-pressed="'+S.muted+'"><span class="c '+(S.muted?'on':'')+'">'+I.micOff+'</span>'+(S.muted?t('unmute'):t('mute'))+'</button><button data-end><span class="c end">'+I.x+'</span>'+t('end')+'</button>')+'<button data-mode="text"><span class="c">'+I.kbd+'</span>'+t('type')+'</button></div>';
  }
  el.innerHTML = head + '<div class="sh-body">'+body+'</div>' + foot;
  el.setAttribute('aria-label', (S.who==='samuel'?t('askS'):t('askN')));
  if (S.mode === 'voice' && (S.vstate === 'idle')) startVoice();
}
function startVoice(){ clearTimeout(S.timer); S.vstate = 'connecting'; drawSheet(); S.timer = setTimeout(() => { S.vstate = 'listening'; drawSheet(); S.timer = setTimeout(() => { if (S.mode==='voice' && S.vstate==='listening') { S.vstate = 'speaking'; drawSheet(); S.timer = setTimeout(() => { if (S.vstate==='speaking') { S.vstate='listening'; drawSheet(); } }, 2600); } }, 2600); }, 900); }
document.getElementById('sheet').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) return closeSheet();
  if (b.dataset.mode) { S.mode = b.dataset.mode; if (S.mode==='voice') S.vstate='idle'; else clearTimeout(S.timer); return drawSheet(); }
  if (b.dataset.rmctx) { S.ctx.splice(+b.dataset.rmctx, 1); return drawSheet(); }
  if (b.hasAttribute('data-src')) { S.srcOpen = !S.srcOpen; return drawSheet(); }
  if (b.hasAttribute('data-send')) { const v = document.getElementById('sin').value.trim(); if (!v) return; S.msgs.push({ me: true, t: v }); drawSheet(); setTimeout(() => { S.msgs.push({ me: false }); drawSheet(); }, 500); return; }
  if (b.hasAttribute('data-mute')) { S.muted = !S.muted; return drawSheet(); }
  if (b.hasAttribute('data-end')) { clearTimeout(S.timer); S.vstate = 'ended'; return drawSheet(); }
  if (b.hasAttribute('data-call')) { S.vstate = 'idle'; return drawSheet(); }
});
render();
</script></body></html>
